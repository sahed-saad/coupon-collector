<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coupon Collector — Part 4: Compare &amp; Contrast</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#050612;--surf:#0E1026;--yellow:#FFE135;--blue:#4B64C7;--text:#EEF0FA;--muted:#7B849E;--g0:#22C55E;--g3:#FB923C;--g4:#EF4444}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden}
body{background:radial-gradient(ellipse 80% 60% at 50% 25%,#12173A 0%,var(--ink) 70%);color:var(--text);font-family:'Nunito',system-ui,sans-serif;font-weight:700;display:flex;flex-direction:column;height:100dvh}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100dvh;width:100%;max-width:1160px;margin:0 auto}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(10px,2vh,22px) clamp(16px,3vw,36px);overflow:hidden}
#nav{display:flex;align-items:center;gap:14px;padding:10px 24px 12px;background:rgba(5,6,18,.72);backdrop-filter:blur(16px);border-top:1px solid rgba(255,225,53,.12);flex-shrink:0;transition:opacity .25s,transform .25s}
body.hide-ui #nav{opacity:0;pointer-events:none;transform:translateY(100%);position:fixed;bottom:0;left:0;right:0}
#step-info{min-width:64px}#step-info strong{font-size:15px;color:var(--yellow);font-weight:900}#step-info span{font-size:12px;color:var(--muted)}
#track{flex:1;height:4px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
#fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--yellow));border-radius:999px;transition:width .4s;width:0}
.nav-btn{display:inline-flex;align-items:center;border:none;border-radius:999px;font-family:'Nunito',sans-serif;font-weight:900;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s;flex-shrink:0}
#prev{padding:9px 14px;background:rgba(255,255,255,.07);color:var(--text);font-size:13px}#prev:hover{background:rgba(255,255,255,.14)}#prev:disabled{opacity:.28;cursor:default}
#next{padding:9px 22px;background:var(--yellow);color:#050612;font-size:14px;box-shadow:0 0 22px rgba(255,225,53,.32)}#next:hover{transform:scale(1.05)}#next:active{transform:scale(.96)}
.hint{font-size:11px;color:var(--muted);letter-spacing:.04em;display:none}@media(min-width:820px){.hint{display:inline}}
.scene{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.2vh,22px);width:100%;max-width:1020px;animation:scIn .36s cubic-bezier(.25,.46,.45,.94) both}
@keyframes scIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes scOut{to{opacity:0;transform:translateY(-8px)}}.exit{animation:scOut .2s ease forwards}
.pixel{font-family:'Press Start 2P',monospace;line-height:1.7;text-align:center}
.heading{font-size:clamp(22px,3.4vw,38px);font-weight:900;text-align:center;line-height:1.18;letter-spacing:-.01em}
.sub-short{font-size:clamp(14px,1.8vw,19px);color:rgba(238,240,250,.72);text-align:center;font-weight:800}
.hl{color:var(--yellow)}.hl-green{color:var(--g0)}.hl-orange{color:var(--g3)}.hl-red{color:var(--g4)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 15px;border-radius:999px;font-size:clamp(10px,1.2vw,12px);font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.pill-blue{background:rgba(75,100,199,.22);border:1px solid rgba(75,100,199,.6);color:#A8BCFF}
.pill-yellow{background:rgba(255,225,53,.12);border:1px solid rgba(255,225,53,.45);color:var(--yellow)}
.pill-green{background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.5);color:#86EFAC}
.chip-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.chip{background:rgba(14,16,38,.85);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 18px;font-size:clamp(13px,1.5vw,16px);font-weight:900;display:flex;align-items:center;gap:8px}
.counter{font-family:'Press Start 2P',monospace;font-size:clamp(40px,min(9vw,12vh),84px);color:var(--yellow);text-shadow:0 0 52px rgba(255,225,53,.65);line-height:1.05;text-align:center}
.counter-label{font-size:12px;color:var(--muted);letter-spacing:.2em;margin-top:8px;font-weight:900;text-transform:uppercase;text-align:center}
.formula{background:rgba(255,225,53,.09);border:1.5px solid rgba(255,225,53,.35);border-radius:14px;padding:14px 28px;font-size:clamp(15px,2.2vw,22px);font-weight:900;color:var(--yellow);text-align:center}
.v2card{background:linear-gradient(145deg,#101A4D,#070C29);border:1.5px solid rgba(75,100,199,.65);border-radius:18px;padding:18px 28px;text-align:center;box-shadow:0 0 46px rgba(75,100,199,.25);flex:1;min-width:180px}
.v2-eye{font-size:11px;color:#93A8F4;letter-spacing:.16em;margin-bottom:6px;font-weight:900;text-transform:uppercase}
.v2-title{font-size:clamp(15px,1.8vw,20px);font-weight:900}
.gbtn{padding:12px 28px;border-radius:999px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:var(--text);font-family:'Nunito',sans-serif;font-weight:900;font-size:16px;cursor:pointer;transition:.2s}
.gbtn:hover{border-color:var(--yellow);background:rgba(255,225,53,.14);transform:scale(1.06)}
/* pokemon cards */
.card-row{display:flex;gap:clamp(8px,1.5vw,18px);justify-content:center;flex-wrap:nowrap}
.cw{width:clamp(92px,min(14vw,24vh),156px);aspect-ratio:5/7;perspective:900px;flex-shrink:0}
.ci{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.4,0,.2,1)}
.cw.bob .ci{animation:bob 3.2s ease-in-out infinite}
.cw.bob:nth-child(2) .ci{animation-delay:.4s}.cw.bob:nth-child(3) .ci{animation-delay:.8s}.cw.bob:nth-child(4) .ci{animation-delay:1.2s}.cw.bob:nth-child(5) .ci{animation-delay:1.6s}
@keyframes bob{0%,100%{transform:translateY(0) rotateY(180deg)}50%{transform:translateY(-9px) rotateY(180deg)}}
.cw.flipped .ci{transform:rotateY(180deg)}
.cf,.cb{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cb{background:linear-gradient(145deg,#1d2154,#090a22);border:2.5px solid var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.cf{transform:rotateY(180deg);display:flex;flex-direction:column;border:2.5px solid transparent;overflow:hidden}
.cf.electric{background:linear-gradient(155deg,#F7D02C,#D47A00);border-color:#FFE573;box-shadow:0 0 22px rgba(247,208,44,.42)}
.cf.fire{background:linear-gradient(155deg,#F08030,#B02000);border-color:#FF6030;box-shadow:0 0 22px rgba(240,128,48,.42)}
.cf.psychic{background:linear-gradient(155deg,#F85888,#780060);border-color:#E040FB;box-shadow:0 0 22px rgba(248,88,136,.42)}
.cf.ghost{background:linear-gradient(155deg,#705898,#200040);border-color:#9C27B0;box-shadow:0 0 22px rgba(112,88,152,.42)}
.cf.normal{background:linear-gradient(155deg,#A8A878,#4A4A30);border-color:#C8C890;box-shadow:0 0 20px rgba(168,168,120,.32)}
.c-header{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 8px 2px}
.c-name{color:rgba(0,0,0,.85);font-size:clamp(9px,1.1vw,12px);font-weight:900}
.c-hp{color:rgba(0,0,0,.72);font-size:8px;text-align:right;line-height:1}.c-hp span{font-size:clamp(11px,1.3vw,15px);font-weight:900;display:block}
.c-art{flex:1;margin:2px 6px;background:rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.c-art img{max-width:86%;max-height:86%;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.c-foot{padding:3px 6px 6px;font-size:clamp(8px,.9vw,10px);font-weight:900;color:rgba(0,0,0,.62);text-align:center}
/* deck + pull log */
.mini-deck{display:flex;gap:12px;background:rgba(14,16,38,.75);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:10px 16px}
.mini-slot{width:clamp(48px,9vh,76px);height:clamp(48px,9vh,76px);border-radius:10px;display:flex;align-items:center;justify-content:center;border:2px dashed rgba(255,255,255,.22);color:var(--muted);font-size:20px;transition:.25s}
.mini-slot.owned{background:rgba(34,197,94,.16);border:2px solid var(--g0);box-shadow:0 0 12px rgba(34,197,94,.28)}
.mini-slot.pulse{animation:pulse .5s}@keyframes pulse{50%{transform:scale(1.18);border-color:var(--g3)}}
.mini-slot img{width:84%;height:84%;object-fit:contain}
.log{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:34px;max-width:760px}
.lg{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;animation:popIn .3s both;border:1.5px solid}
.lg img{width:86%;height:86%;object-fit:contain}.lg.n{border-color:var(--g0);background:rgba(34,197,94,.14)}.lg.d{border-color:var(--g3);background:rgba(251,146,60,.12);opacity:.75}
/* code */
.code{width:100%;max-width:700px;background:rgba(5,6,18,.92);border:1.5px solid rgba(75,100,199,.55);border-radius:16px;padding:16px 22px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(11.5px,1.55vw,16px);line-height:1.65;font-weight:700;box-shadow:0 0 40px rgba(75,100,199,.18);white-space:pre;overflow:hidden}
.code .ln{display:block;opacity:0;animation:popIn .35s forwards}
.kw{color:#A8BCFF}.fn{color:var(--yellow)}.cm{color:var(--muted)}.nm{color:#86EFAC}
.ln.hot{background:rgba(255,225,53,.1);border-radius:6px;margin:0 -8px;padding:0 8px}
/* histogram */
.hist{display:flex;align-items:flex-end;gap:4px;height:clamp(110px,30vh,250px);width:100%;max-width:760px;border-bottom:2px solid rgba(255,255,255,.18);padding:0 4px}
.hcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.hb{background:linear-gradient(180deg,var(--yellow),#E8A200);border-radius:4px 4px 0 0;height:0;transition:height .1s}
.hl-x{display:flex;gap:4px;width:100%;max-width:760px;padding:0 4px;font-size:10px;color:var(--muted);font-weight:900}.hl-x span{flex:1;text-align:center}
/* rows */
.rows{width:100%;max-width:700px;display:flex;flex-direction:column;gap:12px}
.cbar-row{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:900}
.cbar-lbl{width:110px;text-align:right;color:var(--muted)}
.cbar-track{flex:1;height:20px;background:rgba(255,255,255,.06);border-radius:999px;position:relative;overflow:hidden}
.cbar-fill{height:100%;border-radius:999px;animation:grow 1s .3s cubic-bezier(.22,1,.36,1) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ref{position:absolute;top:-2px;bottom:-2px;width:3px;background:#fff;box-shadow:0 0 10px #fff;z-index:2}
.stats{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.stat{background:rgba(14,16,38,.85);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px 22px;text-align:center;min-width:150px}
.stat b{display:block;font-family:'Press Start 2P',monospace;font-size:clamp(20px,3vw,32px);color:var(--yellow);margin-bottom:10px;font-weight:400}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:900}
table{border-collapse:collapse;width:100%;max-width:640px;font-size:clamp(14px,1.8vw,18px);font-weight:900}
th{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:8px 14px;text-align:center}
td{padding:11px 14px;text-align:center;border-top:1px solid rgba(255,255,255,.08)}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
.stagger>*{opacity:0;animation:popIn .4s cubic-bezier(.34,1.56,.64,1) forwards}
.stagger>*:nth-child(1){animation-delay:.05s}.stagger>*:nth-child(2){animation-delay:.18s}.stagger>*:nth-child(3){animation-delay:.31s}.stagger>*:nth-child(4){animation-delay:.44s}
.a1{animation:popIn .38s .04s both}.a2{animation:popIn .38s .14s both}.a3{animation:popIn .38s .24s both}.a4{animation:popIn .38s .34s both}
/* ── PART 4 ADDITIONS ── */
#stage{justify-content:flex-start;overflow-y:auto}
.scene{margin:auto 0}
.math-row{display:flex;align-items:center;justify-content:center;gap:clamp(14px,2.5vw,28px);flex-wrap:wrap}
.math-card{background:rgba(14,16,38,.88);border:1.5px solid rgba(255,255,255,.12);border-radius:16px;padding:clamp(12px,2vh,20px) clamp(18px,2.5vw,28px);text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.math-card.glow-yellow{border-color:rgba(255,225,53,.55);background:rgba(255,225,53,.07);box-shadow:0 0 30px rgba(255,225,53,.18)}
.math-card.glow-green{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.07)}
.mc-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:900;margin-bottom:6px}
.mc-val{font-size:clamp(22px,3vw,34px);font-weight:900}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-weight:900;line-height:1.1}
.frac .num{padding:0 6px 4px;border-bottom:2.5px solid currentColor}.frac .den{padding:4px 6px 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,24px);width:100%;align-items:stretch}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.panel{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;min-width:0}
.panel-title{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:var(--muted)}
.split .code{max-width:100%;font-size:clamp(10.5px,1.3vw,14px);padding:14px 16px;overflow-x:auto}
.code .ln{position:relative}
.tg{position:absolute;right:0;top:50%;transform:translateY(-50%);display:inline-flex;gap:4px}
.tg i,.tgl{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--yellow);color:#050612;font-size:11px;font-weight:900;flex-shrink:0}
.legend{display:flex;flex-direction:column;gap:6px;width:100%;max-width:900px}
.lg-row{display:flex;align-items:center;gap:10px;font-size:clamp(12px,1.4vw,15px);font-weight:800;background:rgba(14,16,38,.7);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:6px 12px}
.lg-row code{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--yellow)}
.tbl-wrap{width:100%;overflow-x:auto;display:flex;justify-content:center}
.tbl-wrap table{max-width:900px}
tr.focus td{background:rgba(255,225,53,.09);color:var(--yellow)}
.small{font-size:clamp(12px,1.3vw,14px);color:var(--muted);text-align:center;font-weight:800}
.chart{width:100%;max-width:100%;height:auto;border-radius:12px;background:#fff;display:block}
table.compact{font-size:clamp(12px,1.4vw,15px)}table.compact th,table.compact td{padding:6px 8px}
.lines{display:flex;flex-direction:column;gap:8px;width:100%}
.lines .chip{font-size:clamp(12px,1.4vw,15px);font-weight:800}
.lines .n{flex-shrink:0}
@media(max-width:600px){th{padding:6px 6px;font-size:10px}td{padding:8px 6px}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <div id="stage"></div>
  <div id="nav">
    <div id="step-info"><strong id="snum">1</strong> <span>/ 7</span></div>
    <div id="track"><div id="fill"></div></div>
    <span class="hint">← → or Space &bull; H hides bar</span>
    <button id="prev" class="nav-btn">← BACK</button>
    <button id="next" class="nav-btn">NEXT →</button>
  </div>
</div>

<script>
/* ── STARFIELD ── */
(function(){const cv=document.getElementById('bg'),cx=cv.getContext('2d');let st=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}
function init(){st=Array.from({length:180},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.4+.3,a:Math.random()*.6+.18,ph:Math.random()*6.28,sp:Math.random()*.012+.004}))}
function draw(){cx.clearRect(0,0,cv.width,cv.height);st.forEach(s=>{s.ph+=s.sp;cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.28);cx.fillStyle=`rgba(255,255,255,${s.a*(.55+.45*Math.sin(s.ph))})`;cx.fill()});requestAnimationFrame(draw)}
rs();init();draw();addEventListener('resize',()=>{rs();init()})})();

/* ── CARDS (title art) ── */
const CARDS=[
 {n:'Pikachu',type:'electric',label:'Lightning',hp:60,pid:25,icon:'⚡'},
 {n:'Charizard',type:'fire',label:'Fire',hp:150,pid:6,icon:'🔥'},
 {n:'Mewtwo',type:'psychic',label:'Psychic',hp:120,pid:150,icon:'✨'},
 {n:'Gengar',type:'ghost',label:'Ghost',hp:90,pid:94,icon:'👻'},
 {n:'Snorlax',type:'normal',label:'Normal',hp:160,pid:143,icon:'😴'}];
const pokeball=s=>`<svg viewBox="0 0 48 48" width="${s}" height="${s}" fill="none"><circle cx="24" cy="24" r="22" stroke="#FFCB05" stroke-width="2.2"/><line x1="2" y1="24" x2="46" y2="24" stroke="#FFCB05" stroke-width="2.2"/><path d="M24 2A22 22 0 0 1 46 24L30 24A6 6 0 0 0 18 24L2 24A22 22 0 0 1 24 2Z" fill="rgba(220,0,0,.38)"/><circle cx="24" cy="24" r="6" stroke="#FFCB05" stroke-width="2.2" fill="rgba(5,6,18,.9)"/><circle cx="24" cy="24" r="2.5" fill="#FFCB05"/></svg>`;
const mkCard=(c,flipped,bob)=>`<div class="cw${flipped?' flipped':''}${bob?' bob':''}"><div class="ci"><div class="cb">${pokeball(46)}</div><div class="cf ${c.type}"><div class="c-header"><span class="c-name">${c.n}</span><span class="c-hp"><span>${c.hp}</span>HP</span></div><div class="c-art"><img src="${ART}${c.pid}.png" alt="${c.n}"></div><div class="c-foot">${c.icon} ${c.label}</div></div></div></div>`;
const ART='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/';
/* ── CODE LINES ── */
const CODE=[
 '<span class="kw">import</span> random','',
 '<span class="kw">def</span> <span class="fn">collect</span>(n=<span class="nm">5</span>):',
 '    owned = <span class="fn">set</span>()          <span class="cm"># cards we have</span>',
 '    packs = <span class="nm">0</span>',
 '    <span class="kw">while</span> <span class="fn">len</span>(owned) &lt; n:  <span class="cm"># until set complete</span><span class="tg"><i>1</i><i>2</i></span>',
 '        owned.add(random.randint(<span class="nm">1</span>, n))',
 '        packs += <span class="nm">1</span>',
 '    <span class="kw">return</span> packs','',
 'trials = [collect() <span class="kw">for</span> _ <span class="kw">in</span> <span class="fn">range</span>(<span class="nm">100_000</span>)]',
 '<span class="fn">print</span>(<span class="fn">sum</span>(trials) / <span class="fn">len</span>(trials))   <span class="cm"># ≈ 11.42</span><span class="tg"><i>3</i></span>'];
const HOT=[5,11];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let step=0;const TOTAL=7;
const stage=document.getElementById('stage'),fill=document.getElementById('fill'),snum=document.getElementById('snum'),nextBtn=document.getElementById('next'),prevBtn=document.getElementById('prev');

async function go(s){
  const old=stage.querySelector('.scene');if(old){old.classList.add('exit');await wait(190)}
  stage.innerHTML='';stage.scrollTop=0;step=s;snum.textContent=s+1;fill.style.width=`${(s+1)/TOTAL*100}%`;
  prevBtn.disabled=s===0;nextBtn.textContent=s===TOTAL-1?'DONE ✓':'NEXT →';
  const d=document.createElement('div');d.className='scene';

  if(s===0){d.innerHTML=`
    <div class="pill pill-blue a1">PART 4 &bull; COMPARE &amp; CONTRAST</div>
    <div class="pixel a2" style="font-size:clamp(14px,2.6vw,28px);color:var(--yellow);text-shadow:0 0 32px rgba(255,225,53,.5);">DO THE MATH AND THE SIMULATION AGREE?</div>
    <div class="card-row stagger">${CARDS.map(c=>mkCard(c,true,true)).join('')}</div>
    <div class="chip-row a4"><div class="chip">Math</div><div class="chip">Code</div><div class="chip">Randomness</div><div class="chip">Real life</div></div>`}

  else if(s===1){d.innerHTML=`
    <div class="pill pill-yellow a1">TWO WAYS, ONE QUESTION</div>
    <div class="split a2">
      <div class="panel">
        <div class="panel-title">The math</div>
        <div class="math-card glow-yellow" style="width:100%">
          <div class="mc-label">Expected packs</div>
          <div style="font-size:clamp(15px,2vw,22px);font-weight:900;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center">
            <span>E[Packs] = n × (1 +</span>
            <span class="frac"><span class="num">1</span><span class="den">2</span></span><span>+</span>
            <span class="frac"><span class="num">1</span><span class="den">3</span></span><span>+ ... +</span>
            <span class="frac"><span class="num">1</span><span class="den">n</span></span><span>)</span></div>
          <div class="mc-val hl" style="margin-top:14px">5 × H₅ = 11.42</div>
        </div>
        <div class="small">In state k, the chance of a new card is (n &minus; k)/n, so the average wait is n/(n &minus; k). Add the waits up.</div>
      </div>
      <div class="panel">
        <div class="panel-title">The simulation</div>
        <div class="code">${CODE.map((l,i)=>`<span class="ln${HOT.includes(i)?' hot':''}" style="animation-delay:${.15+i*.12}s">${l||' '}</span>`).join('')}</div>
      </div>
    </div>
    <div class="legend a3">
      <div class="lg-row"><span class="tgl">1</span><span><code>len(owned)</code> ↔ the state <span class="hl">k</span> (how many different cards we own)</span></div>
      <div class="lg-row"><span class="tgl">2</span><span>the <code>while</code> loop ↔ walking up the chain until state <span class="hl">n</span></span></div>
      <div class="lg-row"><span class="tgl">3</span><span><code>sum(trials) / len(trials)</code> ↔ averaging many runs approximates E[Packs]</span></div>
    </div>
    <div class="chip-row a4"><div class="chip hl">Same answer, found two completely different ways</div></div>`}

  else if(s===2){
    const A=[['5','11.42','11.46','0.04','0.05'],['10','29.29','29.21','0.08','0.11'],['100','518.74','519.27','0.53','1.26']];
    d.innerHTML=`
    <div class="pill pill-green a1">LET’S COMPARE</div>
    <h2 class="heading a2">Math vs. <span class="hl">Simulation</span></h2>
    <div class="tbl-wrap a3"><table><tr><th>Set size</th><th>Math (exact)</th><th>Simulation (10,000 runs)</th><th>Gap</th><th>Expected wobble (SE)</th></tr>
    ${A.map(r=>`<tr${r[0]==='100'?' class="focus"':''}><td class="hl">${r[0]}</td><td>${r[1]}</td><td class="hl-green">${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</table></div>
    <div class="sub-short a4">Every gap is about the size of the expected wobble or smaller, so the simulation <span class="hl-green">agrees</span> with the math.</div>`}

  else if(s===3){
    const B=[['10','36.90','7.61','3.55'],['100','29.41','0.12','1.12'],['1,000','29.28','0.01','0.35'],['10,000','29.32','0.03','0.11'],['100,000','29.33','0.04','0.04']];
    d.innerHTML=`
    <div class="pill pill-yellow a1">WHY ISN’T IT EXACTLY EQUAL?</div>
    <h2 class="heading a2">Randomness: the Gap <span class="hl">Shrinks</span> as We Run More</h2>
    <div class="split a3">
      <div class="panel">
        <img class="chart" src="convergence.png" alt="Line chart for a 10-card set: the blue simulation average swings widely for few runs, then settles onto the red dashed math answer of 29.29 as runs grow from 1 to 20,000 on a logarithmic x-axis.">
        <div class="small">Blue = simulation average. Red dashed = math answer (<span class="hl">29.29</span>). The x-axis is logarithmic.</div>
      </div>
      <div class="panel">
        <div class="lines">
          <div class="chip"><span class="hl n">1</span>One run is random. For 5 cards, one collector may need 5 packs, another 55.</div>
          <div class="chip"><span class="hl n">2</span>An average of a limited number of runs is slightly off. That leftover gap comes from randomness, not a mistake in either method.</div>
          <div class="chip"><span class="hl n">3</span>The typical size of that error is the standard error: SE = σ ÷ √N.</div>
          <div class="chip"><span class="hl n">4</span><span class="hl">4× more runs = half the wobble.</span></div>
        </div>
        <div class="small">Same data as the chart: 10 cards, math answer 29.29</div>
        <div class="tbl-wrap"><table class="compact"><tr><th>Runs</th><th>Simulation</th><th>Gap</th><th>Expected wobble (SE)</th></tr>
        ${B.map(r=>`<tr><td class="hl">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table></div>
      </div>
    </div>`}

  else if(s===4){d.innerHTML=`
    <div class="pill pill-blue a1">MAKING IT REALISTIC</div>
    <h2 class="heading a2">Rare Cards <span class="hl">Change Everything</span></h2>
    <div class="chip-row a2"><div class="chip">10 cards</div><div class="chip">2 of them are <span class="hl">5× rarer</span></div></div>
    <div class="sub-short a3">Rare card: about <span class="hl">2.4%</span> per pack. Common card: about <span class="hl">11.9%</span> per pack.</div>
    <div class="math-row stagger">
      <div class="math-card"><div class="mc-label">Equal odds · math</div><div class="mc-val">29.29</div></div>
      <div class="math-card glow-yellow"><div class="mc-label">Rare cards · math</div><div class="mc-val hl">65.14</div></div>
      <div class="math-card glow-green"><div class="mc-label">Rare cards · simulation</div><div class="mc-val hl-green">64.95</div></div></div>
    <div class="sub-short a4" style="max-width:760px">The simple formula no longer works, so the exact answer uses inclusion-exclusion over every group of cards. Simulation checks it.</div>
    <div class="chip-row a4"><div class="chip hl">Rare cards more than double the cost</div></div>`}

  else if(s===5){d.innerHTML=`
    <div class="pill pill-green a1">IS TRADING WORTH IT?</div>
    <h2 class="heading a2">Swap Duplicates, <span class="hl">Save Packs</span></h2>
    <div class="math-row stagger">
      <div class="math-card"><div class="mc-label">No trading</div><div class="mc-val hl-red">35.27</div><div class="small">packs each</div></div>
      <div class="math-card glow-green"><div class="mc-label">Trading</div><div class="mc-val hl-green">29.70</div><div class="small">packs each</div></div></div>
    <div class="chip-row a3"><div class="chip hl">≈ 16% fewer packs</div></div>
    <div class="small a4" style="max-width:780px">Model: 10 cards, 2 friends, each opens 1 pack per round, duplicates are swapped 1-for-1 whenever both people need what the other has spare. Packs counted until BOTH sets are complete.</div>`}

  else if(s===6){d.innerHTML=`
    <div class="pill pill-green a1">SERIES RECAP</div>
    <h2 class="heading a2">Math + Simulation = <span class="hl">Confidence</span></h2>
    <div class="chip-row stagger" style="width:100%;align-items:stretch">
      <div class="v2card"><div class="v2-eye">Part 2</div><div class="v2-title">Exact math<br><span class="hl">n × Hₙ</span></div></div>
      <div class="v2card"><div class="v2-eye">Part 3</div><div class="v2-title">Simulation<br><span class="hl-green">the average of many runs</span></div></div>
      <div class="v2card"><div class="v2-eye">Part 4</div><div class="v2-title">Compare<br><span class="hl">the gap is just randomness, and it shrinks</span></div></div></div>
    <div class="chip-row a4"><div class="chip hl">Now you can solve it, simulate it, and trust it.</div></div>`}

  stage.appendChild(d);
}

nextBtn.onclick=()=>{if(step<TOTAL-1)go(step+1)};
prevBtn.onclick=()=>{if(step>0)go(step-1)};
document.addEventListener('keydown',e=>{
  if(['ArrowRight',' ','Enter'].includes(e.key)&&step<TOTAL-1&&e.target.tagName!=='BUTTON'){e.preventDefault();go(step+1)}
  else if(e.key==='ArrowLeft'&&step>0){e.preventDefault();go(step-1)}
  else if(e.key.toLowerCase()==='h')document.body.classList.toggle('hide-ui');
});
go(0);
</script>
  <script src="/nav.js"></script>
</body>
</html>
